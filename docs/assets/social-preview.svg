<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">iOS Agent Playbook</title>
  <desc id="desc">Plan, slice, verify. A process skill for AI coding agents doing iOS work.</desc>
